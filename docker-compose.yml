services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: clinica
      MYSQL_ROOT_PASSWORD: 1234
    ports: ["3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/datos_prueba_parcial2.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./backend/src/main/resources/migracion_base_adjunta.sql:/docker-entrypoint-initdb.d/03-base-adjunta.sql:ro
      - ./backend/src/main/resources/migracion_examen_final.sql:/docker-entrypoint-initdb.d/04-final.sql:ro
      - ./backend/src/main/resources/migracion_requerimientos.sql:/docker-entrypoint-initdb.d/05-requerimientos.sql:ro
      - ./backend/src/main/resources/migracion_portal_cliente.sql:/docker-entrypoint-initdb.d/06-portal-cliente.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [backend]
volumes:
  mysql_data:
