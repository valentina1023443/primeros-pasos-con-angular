<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Gestión de Citas</h4>
    <div><button class="btn btn-outline-secondary me-2" (click)="vista='lista'">Lista</button><button class="btn btn-outline-secondary me-2" (click)="vista='dia'">Día</button><button class="btn btn-outline-secondary me-2" (click)="vista='semana'">Semana</button><button class="btn btn-outline-secondary me-2" (click)="vista='mes'">Mes</button><button class="btn btn-primary" (click)="abrirFormulario()">+ Nueva cita</button></div>
  </div>

  <app-tabla-datos *ngIf="vista === 'lista'"
    [columnas]="columnas"
    [filas]="citas"
    [cargando]="cargando"
    [ordenInicial]="{ ruta: 'fechaHora', direccion: 'desc' }"
    rutaFiltroFechas="fechaHora"
    [plantillaAcciones]="acciones"
    mensajeVacio="No hay citas registradas.">
  </app-tabla-datos>

  <section *ngIf="vista === 'mes' || vista === 'semana' || vista === 'dia'" class="card shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center"><button class="btn btn-sm btn-light" (click)="anteriorMes()">‹</button><strong class="text-capitalize">{{ tituloCalendario }}</strong><button class="btn btn-sm btn-light" (click)="siguienteMes()">›</button></div>
    <div class="calendar-grid calendar-head" *ngIf="vista !== 'dia'"><span *ngFor="let d of ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom']">{{ d }}</span></div>
    <div class="calendar-grid"><div class="calendar-day" *ngFor="let day of diasCalendario"><small>{{ day.getDate() }}</small><button *ngFor="let cita of citasDelDia(day)" class="calendar-event" [class.bg-success]="cita.estado === 'ATENDIDA'" [class.bg-danger]="cita.estado === 'CANCELADA'" (click)="abrirFormulario(cita)">{{ cita.fechaHora | date:'shortTime' }} · {{ cita.mascotaNombre }}</button></div></div>
  </section>
</div>

<ng-template #acciones let-cita>
  <button class="btn btn-sm btn-outline-secondary me-1" (click)="abrirFormulario(cita)">
    {{ cita.estado === 'CANCELADA' ? 'Ver' : 'Editar' }}
  </button>
  <button *ngIf="cita.estado === 'CANCELADA'" class="btn btn-sm btn-outline-success" (click)="reactivar(cita)">Reactivar</button>
  <button *ngIf="cita.estado !== 'CANCELADA' && cita.estado !== 'ATENDIDA'" class="btn btn-sm btn-outline-danger" (click)="cancelar(cita)">Cancelar</button>
</ng-template>
