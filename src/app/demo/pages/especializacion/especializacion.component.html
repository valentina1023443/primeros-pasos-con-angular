<div class="container mt-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Gestión de Especializaciones</h3>
    <button class="btn btn-primary" (click)="abrirModalAgregar(modalItem)">+ Agregar especialización</button>
  </div>

  <div *ngIf="cargando">Cargando...</div>

  <table class="table table-striped" *ngIf="!cargando">
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Código</th><th>Descripción</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of registros">
        <td>{{ e.id }}</td>
        <td>{{ e.nombre }}</td>
        <td>{{ e.codigoEspecializacion }}</td>
        <td>{{ e.descripcion }}</td>
        <td><button class="btn btn-sm btn-outline-secondary" (click)="abrirModalEditar(modalItem, e)">Editar</button></td>
      </tr>
      <tr *ngIf="registros.length === 0"><td colspan="5" class="text-center">No hay especializaciones registradas</td></tr>
    </tbody>
  </table>
</div>

<ng-template #modalItem let-modal>
  <div class="modal-header">
    <h5 class="modal-title">{{ editando ? 'Editar' : 'Agregar' }} especialización</h5>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <div class="alert alert-danger" *ngIf="mensajeError">{{ mensajeError }}</div>
    <form [formGroup]="form">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" formControlName="nombre">
      </div>
      <div class="mb-3">
        <label class="form-label">Código</label>
        <input type="text" class="form-control" formControlName="codigoEspecializacion" placeholder="MG01">
      </div>
      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea class="form-control" formControlName="descripcion"></textarea>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancelar</button>
    <button class="btn btn-primary" (click)="guardar(modal)">Guardar</button>
  </div>
</ng-template>
