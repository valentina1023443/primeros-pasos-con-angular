<div class="container mt-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Gestión de Razas</h3>
    <button class="btn btn-primary" (click)="abrirModalAgregar(modalRaza)">+ Agregar raza</button>
  </div>

  <div *ngIf="cargando">Cargando...</div>

  <table class="table table-striped" *ngIf="!cargando">
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Especie</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of registros">
        <td>{{ r.razaId }}</td>
        <td>{{ r.nombre }}</td>
        <td>{{ r.especie }}</td>
        <td><button class="btn btn-sm btn-outline-secondary" (click)="abrirModalEditar(modalRaza, r)">Editar</button></td>
      </tr>
      <tr *ngIf="registros.length === 0"><td colspan="4" class="text-center">No hay razas registradas</td></tr>
    </tbody>
  </table>
</div>

<ng-template #modalRaza let-modal>
  <div class="modal-header">
    <h5 class="modal-title">{{ editando ? 'Editar' : 'Agregar' }} raza</h5>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <div class="alert alert-danger" *ngIf="mensajeError">{{ mensajeError }}</div>
    <form [formGroup]="form">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" formControlName="nombre">
      </div>
      <div class="mb-3">
        <label class="form-label">Especie</label>
        <input type="text" class="form-control" formControlName="especie" placeholder="Perro, Gato...">
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancelar</button>
    <button class="btn btn-primary" (click)="guardar(modal)">Guardar</button>
  </div>
</ng-template>
